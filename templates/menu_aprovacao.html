<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerenciamento de Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #022855;
            --secondary-color: #00aaf8;
            --background-color: #f7f9fc;
            --menu-bg: #022855;
            --menu-hover-bg: rgba(20, 116, 243, 0.87);
            --button-bg: #ff4d4d;
            --button-hover-bg: #ff1a1a;
            --text-color: #ffffff;
            --hover-effect: all 0.3s ease;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --mobile-header-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            overflow-x: hidden;
        }

        .menu-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            background-color: var(--background-color);
            position: relative;
        }

        /* Menu Desktop */
        .menu {
            width: 220px;
            border-right: 1px solid #e0e0e0;
            padding: 15px 10px;
            background-color: var(--menu-bg);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            overflow-y: auto;
            max-height: 100vh;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .menu.collapsed {
            width: 60px;
            padding: 15px 5px;
        }

        .toggle-menu-btn {
            position: fixed;
            left: 10px;
            top: 10px;
            z-index: 1000;
            background-color: var(--menu-bg);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--hover-effect);
            box-shadow: var(--shadow);
        }

        .toggle-menu-btn:hover {
            background-color: var(--menu-hover-bg);
            transform: scale(1.05);
        }

        .menu.collapsed+.content .toggle-menu-btn {
            left: 10px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            overflow: hidden;
            min-height: 120px;
        }

        .logo {
            width: 140px;
            height: auto;
            max-height: 80px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            object-fit: contain;
        }

        .menu.collapsed .logo-container {
            margin-bottom: 15px;
            min-height: auto;
        }

        .menu.collapsed .logo {
            width: 40px;
            opacity: 1;
            margin-bottom: 0;
        }

        /* Título do menu - Agora com h3 */
        .menu h3 {
            text-align: center;
            color: var(--text-color);
            font-size: 1rem;
            margin: 8px 0 12px;
            padding: 0 5px 6px;
            border-bottom: 2px solid var(--secondary-color);
            transition: all 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            font-weight: 500;
        }

        .menu.collapsed h3 {
            opacity: 0;
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
        }

        .menu ul {
            list-style-type: none;
            padding: 0;
            width: 100%;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
        }

        .menu li {
            margin: 5px 0;
            overflow: hidden;
        }

        .menu a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            transition: var(--hover-effect);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .menu.collapsed a {
            justify-content: center;
            padding: 8px 5px;
        }

        .menu a i {
            margin-right: 8px;
            min-width: 18px;
            text-align: center;
            font-size: 0.95rem;
        }

        .menu.collapsed a i {
            margin-right: 0;
            font-size: 1rem;
        }

        .menu a span {
            transition: opacity 0.3s ease, width 0.3s ease;
        }

        .menu.collapsed a span {
            opacity: 0;
            width: 0;
            display: none;
        }

        .menu a:hover {
            background-color: var(--menu-hover-bg);
            transform: translateX(3px);
            padding-left: 12px;
        }

        .menu.collapsed a:hover {
            transform: none;
            padding-left: 5px;
        }

        .menu a.active {
            background-color: var(--secondary-color);
            color: var(--text-color);
            font-weight: 600;
        }

        .logout-container {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logout-btn {
            background-color: var(--button-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            transition: var(--hover-effect);
            font-weight: 500;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn i {
            margin-right: 6px;
        }

        .menu.collapsed .logout-btn {
            padding: 8px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu.collapsed .logout-btn i {
            margin-right: 0;
        }

        .menu.collapsed .logout-btn span {
            display: none;
        }

        .logout-btn:hover {
            background-color: var(--button-hover-bg);
            transform: translateY(-2px);
        }

        .content {
            padding: 12px;
            flex-grow: 1;
            background-color: #ffffff;
            border-radius: 8px;
            margin-left: 5px;
            min-height: 100vh;
            overflow-y: auto;
            transition: margin-left 0.3s ease;
            position: relative;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.05);
        }

        .menu.collapsed+.content {
            margin-left: 0;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 25px);
            border: none;
            border-radius: 6px;
            background-color: #fff;
            min-height: 500px;
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        /* Menu Mobile */
        .mobile-header {
            display: none;
            background-color: var(--menu-bg);
            color: var(--text-color);
            padding: 0 12px;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            box-shadow: var(--shadow);
            height: var(--mobile-header-height);
        }

        .mobile-header .logo-mobile {
            height: 36px;
            max-width: 140px;
            object-fit: contain;
        }

        .mobile-menu-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
        }

        .mobile-menu-overlay {
            position: fixed;
            top: var(--mobile-header-height);
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: var(--hover-effect);
        }

        .mobile-menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Ajustes específicos para notebooks (1366x768) */
        @media (min-width: 993px) and (max-width: 1366px) {
            .menu {
                width: 190px;
                padding: 12px 8px;
            }
            
            .menu h3 {
                font-size: 0.9rem;
                margin: 6px 0 10px;
                padding-bottom: 5px;
            }
            
            .logo {
                width: 110px;
                margin-bottom: 6px;
            }
            
            .menu a {
                padding: 7px 8px;
                font-size: 0.8rem;
            }
            
            .content {
                padding: 10px;
            }
        }

        /* Ajustes extras para telas menores */
        @media (min-width: 993px) and (max-width: 1200px) and (max-height: 768px) {
            .menu {
                width: 180px;
            }
            
            .menu h3 {
                font-size: 0.85rem;
                line-height: 1.1;
            }
            
            .logo {
                width: 90px;
            }
        }

        /* Responsividade para tablets e celulares */
        @media (max-width: 992px) {
            .menu {
                position: fixed;
                left: 0;
                top: var(--mobile-header-height);
                bottom: 0;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 999;
                height: calc(100vh - var(--mobile-header-height));
                box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
                width: 260px;
                padding-top: 15px;
            }

            .menu.open {
                transform: translateX(0);
            }

            .menu.collapsed {
                transform: translateX(-100%);
            }

            .menu.collapsed.open {
                transform: translateX(0);
                width: 260px;
                padding: 15px 8px;
            }

            .menu.collapsed.open .logo {
                width: 120px;
                margin-bottom: 8px;
            }

            .menu.collapsed.open h3 {
                font-size: 0.95rem;
                margin: 8px 0 12px;
                padding-bottom: 6px;
            }

            .mobile-header {
                display: flex;
            }

            .content {
                margin-left: 0;
                margin-top: var(--mobile-header-height);
                min-height: calc(100vh - var(--mobile-header-height));
                padding: 10px;
            }

            iframe {
                height: calc(100vh - var(--mobile-header-height) - 20px);
            }
        }

        @media (max-width: 576px) {
            .menu {
                width: 240px;
            }
            
            .mobile-header .logo-mobile {
                height: 32px;
                max-width: 120px;
            }
        }

        @media (max-width: 400px) {
            .menu {
                width: 220px;
            }
            
            .menu h3 {
                font-size: 0.9rem;
            }
        }

        /* Efeitos interativos */
        button:active, .menu a:active {
            transform: scale(0.98);
        }

        /* Tooltip para menu recolhido */
        .menu.collapsed a::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--menu-bg);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: var(--hover-effect);
            pointer-events: none;
            margin-left: 8px;
            box-shadow: var(--shadow);
            z-index: 1000;
        }

        .menu.collapsed a:hover::after {
            opacity: 1;
            visibility: visible;
            margin-left: 12px;
        }
    </style>
</head>
<body>
    <!-- Cabeçalho Mobile -->
    <div class="mobile-header">
        <img src="https://images.crunchbase.com/image/upload/c_pad,f_auto,q_auto:eco,dpr_1/xsire5bsc2uce2mekekd"
            alt="Logotipo" class="logo-mobile">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    </div>

    <!-- Overlay para menu mobile -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

    <div class="menu-container">
        <div class="menu" id="menu">
            <div class="logo-container">
                <img src="https://images.crunchbase.com/image/upload/c_pad,f_auto,q_auto:eco,dpr_1/xsire5bsc2uce2mekekd"
                    alt="Logotipo" class="logo">
                <h3>Líder de Pedidos</h3>
            </div>
            
            <ul>
             
                <li><a href="{{ url_for('routes_bp.aprovar_solicitacao') }}" target="content-frame" data-tooltip="Preencher Cotação"><i
                            class="fas fa-file-alt"></i><span>Aprovar Solicitacao</span></a></li>

               <li><a href="{{ url_for('routes_bp.listar_pedidos_compra') }}" target="content-frame" data-tooltip="Pedidos Compras"><i
                            class="fas fa-file-invoice-dollar"></i><span>Pedidos Compras</span></a></li>
              
            </ul>
            
            <div class="logout-container">
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Sair</span></button>
            </div>
        </div>
        
        <div class="content">
            <button class="toggle-menu-btn" id="toggleMenuBtn">☰</button>
            <iframe name="content-frame" src="{{ url_for('routes_bp.dashboard') }}" id="contentFrame"></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menu = document.getElementById('menu');
            const toggleMenuBtn = document.getElementById('toggleMenuBtn');
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
            const contentFrame = document.getElementById('contentFrame');
            
            // Carrega o iframe inicial
            contentFrame.src = "{{ url_for('routes_bp.dashboard') }}";

            // Verifica o estado do menu no localStorage
            const menuState = localStorage.getItem('menuCollapsed');
            if (menuState === 'true') {
                menu.classList.add('collapsed');
                toggleMenuBtn.textContent = '☰';
            }

            // Atualiza a altura do iframe
            function updateIframeHeight() {
                const headerHeight = document.querySelector('.mobile-header') ? 
                    document.querySelector('.mobile-header').offsetHeight : 0;
                const contentPadding = 25;
                const newHeight = `calc(100vh - ${headerHeight + contentPadding}px)`;
                contentFrame.style.height = newHeight;
            }

            // Evento para redimensionamento da janela
            window.addEventListener('resize', function() {
                updateIframeHeight();
                // Fechar menu se a tela for redimensionada para desktop
                if (window.innerWidth > 992) {
                    menu.classList.remove('open');
                    mobileMenuOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });

            // Atualizar altura inicial
            updateIframeHeight();

            // Logout
            window.logout = function() {
                const confirmation = confirm("Você tem certeza que deseja sair?");
                if (confirmation) {
                    window.location.href = "{{ url_for('routes_bp.logout') }}";
                }
            };

            // Toggle menu desktop
            toggleMenuBtn.addEventListener('click', function() {
                menu.classList.toggle('collapsed');
                localStorage.setItem('menuCollapsed', menu.classList.contains('collapsed'));
                this.textContent = menu.classList.contains('collapsed') ? '☰' : '✕';
            });

            // Toggle menu mobile
            mobileMenuBtn.addEventListener('click', function() {
                menu.classList.add('open');
                mobileMenuOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            });

            // Fechar menu mobile ao clicar no overlay
            mobileMenuOverlay.addEventListener('click', function() {
                menu.classList.remove('open');
                this.classList.remove('active');
                document.body.style.overflow = '';
            });

            // Fechar menu mobile ao clicar em um link
            document.querySelectorAll('.menu a').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 992) {
                        menu.classList.remove('open');
                        mobileMenuOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                    
                    // Adiciona classe active ao link clicado
                    document.querySelectorAll('.menu a').forEach(item => {
                        item.classList.remove('active');
                    });
                    this.classList.add('active');
                });
            });

            // Fechar menu ao pressionar Esc
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    menu.classList.remove('open');
                    mobileMenuOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });
    </script>
</body>

</html>
