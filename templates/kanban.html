<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <style>
      /* Estilos gerais */
body, html {
    font-family: 'Roboto', sans-serif;
    background-color: #f5f7fa;
    margin: 0;
    padding: 0;
    color: #333;
}

/* Container do Kanban */
.kanban-container {
    display: flex;
    justify-content: flex-start; /* Alinha as colunas à esquerda */
    gap: 30px; /* Espaçamento entre as colunas */
    padding: 30px;
    flex-wrap: wrap; /* Permite que as colunas quebrem para a linha seguinte */
    max-width: 1200px;
    margin: 0 auto;
    box-sizing: border-box; /* Certifica-se de que o padding e a borda não afetam o cálculo da largura */
}

/* Coluna do Kanban */
.kanban-column {
    width: 30%; /* As colunas ocupam 30% do espaço disponível */
    box-sizing: border-box; /* Inclui o padding e borda dentro da largura definida */
    background-color: #ffffff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    min-height: 400px;
    transition: box-shadow 0.3s ease, transform 0.3s ease, background-color 0.3s ease;
    overflow-y: auto;
}

/* Hover nas colunas */
.kanban-column:hover {
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    transform: translateY(-10px);
}

/* Títulos das Colunas */
.kanban-column h2 {
    text-align: center;
    padding: 12px;
    color: #fff;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 1.3em;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase; /* Deixa os títulos mais fortes */
}

/* Cores das Colunas */
.todo-column h2 {
    background-color: #ff7043; /* Laranja suave */
}

.in-progress-column h2 {
    background-color: #016dda; /* Amarelo suave */
}

.done-column h2 {
    background-color: #388e3c; /* Verde mais escuro */
}

/* Lista de Tarefas */
.task-list {
    list-style-type: none;
    padding: 0;
    margin-top: 10px;
}

.task-list li {
    background-color: #e3f2fd;
    margin: 10px 0;
    padding: 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s, margin-top 0.2s ease;
}

/* Animação ao passar o mouse nas tarefas */
.task-list li:hover {
    background-color: #bbdefb;
    transform: translateY(-5px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    margin-top: 15px; /* Adiciona um leve movimento */
}

/* Botão de deletar */
.delete-btn {
    background: none;
    border: none;
    color: #ff7043;
    font-size: 1.5em;
    cursor: pointer;
    transition: color 0.3s ease;
    opacity: 0.7;
}

.delete-btn:hover {
    color: #d32f2f;
    opacity: 1; /* Aumenta a opacidade no hover */
}

/* Formulário para Adicionar Tarefas */
.add-task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    gap: 15px;
}

.add-task input, .add-task select {
    flex: 1;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 4px;
    font-size: 1em;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    transition: border-color 0.3s, box-shadow 0.3s;
}

/* Efeito de foco nos campos */
.add-task input:focus, .add-task select:focus {
    outline: none;
    border-color: #0288d1;
    box-shadow: 0 0 10px rgba(2, 136, 209, 0.3);
}

.add-task button {
    padding: 12px 18px;
    background-color: #016dda;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.3s ease;
    font-size: 1em;
}

.add-task button:hover {
    background-color: #0277bd;
    transform: scale(1.05); /* Efeito de zoom no botão */
}

/* Responsividade */
@media (max-width: 1024px) {
    .kanban-column {
        width: 45%; /* Colunas ocupam 45% da largura */
    }
}

@media (max-width: 768px) {
    .kanban-column {
        width: 100%; /* Colunas ocupam 100% da largura em telas pequenas */
        margin-bottom: 30px;
    }

    .add-task {
        flex-direction: column;
        gap: 15px;
    }

    .add-task button {
        width: 100%; /* Botão ocupa 100% da largura */
    }
}

@media (max-width: 480px) {
    .kanban-column {
        width: 100%;
        margin-bottom: 20px;
        padding: 15px;
    }

    .add-task input, .add-task select, .add-task button {
        font-size: 0.9em;
    }

    .add-task {
        gap: 10px;
    }
}

/* Flash message (caso exista) */
.flashes {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    z-index: 10;
}

.alert {
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 10px;
    font-size: 1.1em;
}

.alert-success {
    background-color: #4caf50;
    color: white;
}

.alert-error {
    background-color: #f44336;
    color: white;
}

    </style>
    
</head>
<body>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flashes">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- Formulário para adicionar tarefa -->
    <div class="add-task">
        <h3>Descrição (Tarefa):</h3>
        <input type="text" id="task_name" placeholder="Nome da Tarefa" required>
        <select id="status">
            <option value="A Fazer">A Fazer</option>
        </select>
        <button onclick="addTask()">Adicionar Tarefa</button>
    </div>

    <!-- Container do Kanban -->
    <div class="kanban-container">
        <!-- A Fazer -->
        <div class="kanban-column todo-column" id="todo-column" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2>A Fazer</h2>
            <ul id="todo-list" class="task-list" data-status="A Fazer">
                <!-- As tarefas 'A Fazer' serão listadas aqui -->
            </ul>
        </div>

        <!-- Em Progresso -->
        <div class="kanban-column in-progress-column" id="in-progress-column" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2>Em Progresso</h2>
            <ul id="in-progress-list" class="task-list" data-status="Em Progresso">
                <!-- As tarefas 'Em Progresso' serão listadas aqui -->
            </ul>
        </div>

        <!-- Concluído -->
        <div class="kanban-column done-column" id="done-column" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2>Concluído</h2>
            <ul id="done-list" class="task-list" data-status="Concluído">
                <!-- As tarefas 'Concluído' serão listadas aqui -->
            </ul>
        </div>
    </div>

    <!-- Scripts de JavaScript -->
    <script>
        // Função para carregar as tarefas da API
        function loadTasks() {
            fetch('/tasks')
                .then(response => response.json())
                .then(data => {
                    let tasks = data.tasks;
                    
                    // Limpa as listas de tarefas antes de repopular
                    document.getElementById('todo-list').innerHTML = '';
                    document.getElementById('in-progress-list').innerHTML = '';
                    document.getElementById('done-list').innerHTML = '';

                    tasks.forEach(task => {
                        let taskItem = document.createElement('li');
                        taskItem.textContent = `- ${task.task_name}`;
                        
                        // Botão de exclusão (X)
                        let deleteButton = document.createElement('button');
                        deleteButton.innerHTML = 'x';  // Usando o "X" como ícone
                        deleteButton.classList.add('delete-btn');
                        deleteButton.onclick = function() {
                            deleteTask(task.id);
                        };

                        // Adiciona os botões
                        taskItem.appendChild(deleteButton);

                        // Definir a tarefa como arrastável
                        taskItem.setAttribute('draggable', 'true');
                        taskItem.setAttribute('id', `task-${task.id}`); // Atribui o id correto da tarefa
                        taskItem.setAttribute('ondragstart', 'drag(event)');
                        taskItem.dataset.id = task.id;  // Guarda o id para referência no drop

                        // Adiciona a tarefa na lista correta
                        if (task.status === 'A Fazer') {
                            document.getElementById('todo-list').appendChild(taskItem);
                        } else if (task.status === 'Em Progresso') {
                            document.getElementById('in-progress-list').appendChild(taskItem);
                        } else if (task.status === 'Concluído') {
                            document.getElementById('done-list').appendChild(taskItem);
                        }
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        // Função para adicionar uma nova tarefa via API
        function addTask() {
            const task_name = document.getElementById('task_name').value;
            const status = document.getElementById('status').value || 'A Fazer'; // Garante que o valor seja "A Fazer" por padrão

            fetch('/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    task_name: task_name,
                    status: status
                })
            })
            .then(response => response.json())
            .then(data => {
                // Atualiza as tarefas após adicionar
                loadTasks();
            })
            .catch(error => console.error('Error:', error));
        }

        // Função para excluir uma tarefa via API
        function deleteTask(id) {
            fetch(`/tasks/${id}`, {
                method: 'DELETE',
            })
            .then(response => response.json())
            .then(data => {
                loadTasks(); // Atualiza a lista após exclusão
            })
            .catch(error => console.error('Error:', error));
        }

        // Função para permitir o arraste das tarefas
        function allowDrop(event) {
            event.preventDefault();
        }

        // Função chamada quando começa o arraste
        function drag(event) {
            event.dataTransfer.setData('text', event.target.id);
        }

        // Função para fazer o drop da tarefa na nova coluna
        function drop(event) {
            event.preventDefault();
            const data = event.dataTransfer.getData("text");
            const droppedTask = document.getElementById(data);
            
            // Verifique o novo status com base na coluna onde a tarefa foi solta
            let newStatus;
            if (event.target.id === 'todo-column') {
                newStatus = 'A Fazer';
            } else if (event.target.id === 'in-progress-column') {
                newStatus = 'Em Progresso';
            } else if (event.target.id === 'done-column') {
                newStatus = 'Concluído';
            }

            // Atualiza o status da tarefa ao ser movida para a nova coluna
            fetch(`/tasks/${droppedTask.dataset.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ status: newStatus })
            })
            .then(response => response.json())
            .then(data => {
                loadTasks();  // Atualiza a lista após mudança de status
            })
            .catch(error => console.error('Error:', error));
        }

        // Chama loadTasks para carregar as tarefas ao carregar a página
        window.onload = loadTasks;

// Função para bloquear teclas de atalho
function bloquearTeclas(event) {
  const bloqueadas = [
    123,  // F12
   
  ];

  // Impede teclas específicas ou combinações perigosas
  if (
    bloqueadas.includes(event.keyCode) || // Verifica tecla F12 ou C
    (event.ctrlKey && (event.keyCode === 67)) || // Verifica Ctrl + C
    (event.ctrlKey && event.shiftKey && (event.keyCode === 67)) // Verifica Ctrl + Shift + C
  ) {
    event.preventDefault();  // Impede a ação padrão (copiar, abrir dev tools)
    mostrarMensagem();       // Mostra a mensagem de bloqueio
  }
}

// Função para mostrar uma mensagem de bloqueio personalizada
function mostrarMensagem() {
  const alertMessage = document.createElement('div');
  alertMessage.id = 'alert-message';
  alertMessage.innerHTML = `
    <div style="position: fixed; top: 0; left: 0; width: 100%; background: red; color: white; 
    text-align: center; z-index: 9999; padding: 10px; font-size: 18px;">
      ⚠️ Ação Proibida Detectada!
    </div>
  `;
  
  // Garante que o DOM contenha apenas uma mensagem ao mesmo tempo
  if (!document.getElementById('alert-message')) {
    document.body.appendChild(alertMessage);
    setTimeout(() => {
      document.body.removeChild(alertMessage);
    }, 5000); // Mensagem visível por 5 segundos
  }
}

// Bloquear menu de contexto (botão direito do mouse)
window.oncontextmenu = function (event) {
  event.preventDefault();
  mostrarMensagem();
};

// Medidas suaves contra DevTools (não fechar automaticamente)
(function () {
  let devToolsOpen = false;
  const threshold = 160;

  setInterval(() => {
    const width = window.outerWidth - window.innerWidth;
    const height = window.outerHeight - window.innerHeight;

    // Verifica mudanças significativas na largura/altura da janela
    if (width > threshold || height > threshold) {
      if (!devToolsOpen) {
        devToolsOpen = true;
        console.log("⚠️ Ferramentas de Desenvolvedor Detectadas!");
        // Opcional: apenas logar ou alertar o usuário sem fechar a página
        //alert("⚠️ Ferramentas de Desenvolvedor Detectadas!");
      }
    }
  }, 500); // Intervalo de verificação
})();

// Bloquear print
function bloquearPrint() {
  const overlay = document.createElement('div');
  overlay.style.position = 'absolute';
  overlay.style.top = 0;
  overlay.style.left = 0;
  overlay.style.width = '100%';
  overlay.style.height = '100%';
  overlay.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
  overlay.style.zIndex = 9999;
  overlay.style.pointerEvents = 'none'; // permite interagir com o conteúdo por baixo

  document.body.appendChild(overlay);

  // Remover após um tempo, por exemplo, 5 segundos
  setTimeout(() => {
    document.body.removeChild(overlay);
  }, 5000);
}

// Adiciona o ouvinte de evento para detectar pressionamento de teclas
document.addEventListener('keydown', bloquearTeclas);


    </script>

</body>
</html>
