<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .form-container { max-width: 600px; margin: auto; }
    </style>
</head>
<body>
    <div class="container form-container">
        <h1 class="mb-4 text-center">Cadastrar Material</h1>
        <a href="{{ url_for('routes_bp.menu_master') }}" class="btn btn-secondary mb-3">Voltar ao Menu</a>
        <form method="POST" action="{{ url_for('routes_bp.adicionar_material') }}">
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição do Material</label>
                <input type="text" class="form-control" id="descricao" name="descricao" placeholder="Ex.: Parafuso Aço Inox" required>
            </div>
            <div class="mb-3">
                <label for="empresa" class="form-label">Empresa</label>
                <input type="text" class="form-control" id="empresa" name="empresa" placeholder="Ex.: Empresa XYZ" required>
            </div>
            <div class="mb-3">
                <label for="aplicacao" class="form-label">Aplicação</label>
                <input type="text" class="form-control" id="aplicacao" name="aplicacao" placeholder="Ex.: Montagem Estrutural" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar Material</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show mt-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </divovin
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
