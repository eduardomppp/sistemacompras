<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fornecedor | Sistema de Gestão</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #2980b9;
            --light-gray: #f5f7fa;
            --medium-gray: #e0e0e0;
            --dark-gray: #7f8c8d;
            --error-color: #e74c3c;
            --success-color: #27ae60;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
            color: var(--primary-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            line-height: 1.6;
        }
        
        .form-container {
            width: 100%;
            max-width: 900px;
            margin: 20px;
            box-sizing: border-box;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-header h1 {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        
        .form-header p {
            color: var(--dark-gray);
            font-weight: 300;
            margin-top: 0;
        }
        
        form {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .full-width {
            grid-column: span 2;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: 500;
            font-size: 0.95em;
        }
        
        .required-field::after {
            content: " *";
            color: var(--error-color);
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--medium-gray);
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background-color: #fff;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .form-footer {
            margin-top: 30px;
            text-align: center;
        }
        
        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 500;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: auto;
            display: inline-block;
        }
        
        .btn-submit:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .important-message {
            color: var(--dark-gray);
            font-size: 0.85em;
            margin-top: 25px;
            text-align: center;
            font-style: italic;
            border-top: 1px solid var(--medium-gray);
            padding-top: 15px;
        }
        
        .error-message {
            color: var(--error-color);
            font-size: 0.8em;
            margin-top: 5px;
            display: none;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            right: 15px;
            top: 42px;
            color: var(--dark-gray);
        }
        
        @media only screen and (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .full-width {
                grid-column: span 1;
            }
            
            .form-container {
                width: 95%;
                padding: 0;
            }
            
            form {
                padding: 25px;
            }
            
            .form-header h1 {
                font-size: 1.8em;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>Cadastro de Fornecedor</h1>
            <p>Preencha os dados abaixo para cadastrar um novo fornecedor no sistema</p>
        </div>
        
        <form action="{{ url_for('routes_bp.submit_form') }}" method="post" autocomplete="off" onsubmit="return validateForm()">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nomeFantasia" class="required-field">Nome Fantasia</label>
                    <div class="input-with-icon">
                        <input type="text" id="nomeFantasia" name="nomeFantasia" required placeholder="Digite o nome fantasia">
                        <i class="fas fa-building"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="cnpj" class="required-field">CNPJ</label>
                    <div class="input-with-icon">
                        <input type="text" id="cnpj" name="cnpj" required placeholder="00.000.000/0000-00">
                        <i class="fas fa-id-card"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="telefone" class="required-field">Telefone</label>
                    <div class="input-with-icon">
                        <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
                        <i class="fas fa-phone"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="required-field">E-Mail</label>
                    <div class="input-with-icon">
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <span class="error-message" id="emailError">Por favor, insira um email válido</span>
                </div>
                
                <div class="form-group">
                    <label for="endereco" class="required-field">Endereço</label>
                    <div class="input-with-icon">
                        <input type="text" id="endereco" name="endereco" required placeholder="Rua, número, complemento">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="bairro" class="required-field">Bairro</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>
                
                <div class="form-group">
                    <label for="cidade" class="required-field">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
                
                <div class="form-group">
                    <label for="estado" class="required-field">Estado</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione...</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="contato" class="required-field">Contato Responsável</label>
                    <div class="input-with-icon">
                        <input type="text" id="contato" name="contato" required placeholder="Nome do responsável">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="materiais" class="required-field">Materiais/Peças fornecidos</label>
                    <textarea id="materiais" name="materiais" required placeholder="Descreva os principais materiais ou peças fornecidas por este fornecedor"></textarea>
                </div>
            </div>
            
            <div class="form-footer">
                <input type="submit" class="btn-submit" value="Cadastrar Fornecedor">
                <p class="important-message">Todos os campos marcados com * são obrigatórios. Certifique-se de que as informações estão corretas antes de enviar.</p>
            </div>
        </form>
    </div>

    <script>
        function validateEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        function validateForm() {
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            
            // Reset error display
            emailError.style.display = 'none';
            emailInput.style.borderColor = '';
            
            if (!validateEmail(emailInput.value)) {
                emailError.style.display = 'block';
                emailInput.style.borderColor = '#e74c3c';
                emailInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return false;
            }
            
            return true;
        }

        // Máscara para CNPJ
        document.getElementById('cnpj').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length > 12) {
                value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
            } else if (value.length > 8) {
                value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})/, '$1.$2.$3/$4');
            } else if (value.length > 5) {
                value = value.replace(/^(\d{2})(\d{3})(\d{3})/, '$1.$2.$3');
            } else if (value.length > 2) {
                value = value.replace(/^(\d{2})(\d{3})/, '$1.$2');
            }
            
            e.target.value = value;
        });

        // Máscara para telefone
        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length > 10) {
                value = value.replace(/^(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
            } else if (value.length > 6) {
                value = value.replace(/^(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
            } else if (value.length > 2) {
                value = value.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            } else if (value.length > 0) {
                value = value.replace(/^(\d{0,2})/, '($1');
            }
            
            e.target.value = value;
        });
    </script>
</body>
</html>
