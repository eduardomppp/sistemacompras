<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acesso Seguro - Gestão de Compras</title>
    <link rel="icon" href="https://eduprado.com.br/wp-content/uploads/2024/02/LOGO-PRADO-SEM-FUNDO-4.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1E40AF; /* Azul corporativo */
            --primary-dark: #1E3A8A;
            --text-dark: #111827;
            --text-light: #F9FAFB;
            --bg-color: #F3F4F6; /* Fallback para fundo */
            --card-bg: rgba(255, 255, 255, 0.98);
            --card-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            --error-color: #DC2626;
            --transition: all 0.2s ease-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://efic.com.br/wp-content/uploads/Curso-formacao-em-recuperacao-de-credito-1-1200x630.jpg') no-repeat center/cover fixed;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            color: var(--text-dark);
            backdrop-filter: blur(2px); /* Suave desfoque no fundo */
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.25rem;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .auth-header {
            margin-bottom: 1.25rem;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: url('https://eduprado.com.br/wp-content/uploads/2024/02/LOGO-PRADO-SEM-FUNDO-4.png') center/contain no-repeat;
            margin: 0 auto 0.5rem;
        }

        .app-name {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--primary-color);
        }

        .auth-title {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-dark);
            opacity: 0.65;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            text-align: left;
        }

        .input-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .input-field {
            width: 100%;
            padding: 9px 9px 9px 34px;
            border-radius: 5px;
            border: 1px solid #D1D5DB;
            font-size: 0.9rem;
            background: #FFFFFF;
            transition: var(--transition);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 0.85rem;
        }

        .toggle-password {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        .auth-btn {
            width: 100%;
            padding: 9px;
            background: var(--primary-color);
            color: var(--text-light);
            border: none;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .forgot-password {
            text-align: right;
            margin-top: 5px;
        }

        .forgot-password a {
            color: var(--primary-color);
            font-size: 0.75rem;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.75rem;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .auth-footer {
            margin-top: 0.75rem;
            font-size: 0.7rem;
            color: #6B7280;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 1rem;
                max-width: 320px;
            }
            .app-name {
                font-size: 1.15rem;
            }
            .auth-title {
                font-size: 0.8rem;
            }
            .input-field {
                padding: 8px 8px 8px 32px;
                font-size: 0.85rem;
            }
            .auth-btn {
                padding: 8px;
                font-size: 0.85rem;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --card-bg: rgba(31, 41, 55, 0.95);
                --text-dark: #F9FAFB;
            }
            .input-field {
                background: #4B5563;
                color: var(--text-light);
                border-color: #6B7280;
            }
            .input-field:focus {
                border-color: var(--primary-color);
            }
            .auth-title, .input-label {
                color: var(--text-light);
            }
        }

        .login-card {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="auth-header">
            <div class="logo" aria-hidden="true"></div>
            <h1 class="app-name">Sistema de Gestão de Compras</h1>
            <p class="auth-title">Acesso Restrito aos Colaboradores</p>
        </div>
        
        <form class="auth-form" method="POST" action="/login" id="loginForm" aria-label="Formulário de Login">
            <input type="hidden" name="_csrf" value="{{csrf_token}}">
            
            <div class="input-group">
                <label for="usuario" class="input-label">Usuário</label>
                <div style="position: relative;">
                    <input type="text" id="usuario" name="usuario" class="input-field" placeholder="Digite seu usuário" required autocomplete="username" aria-required="true">
                    <i class="fas fa-user input-icon" aria-hidden="true"></i>
                </div>
                <div id="userError" class="error-message" style="display: none;" role="alert">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span aria-live="polite"></span>
                </div>
            </div>

            <div class="input-group">
                <label for="senha" class="input-label">Senha</label>
                <div style="position: relative;">
                    <input type="password" id="senha" name="senha" class="input-field" placeholder="Digite sua senha" required autocomplete="current-password" aria-required="true">
                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                    <i class="fas fa-eye toggle-password" id="togglePassword" aria-label="Mostrar ou ocultar senha"></i>
                </div>
                <div id="passError" class="error-message" style="display: none;" role="alert">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span aria-live="polite"></span>
                </div>
            </div>

            <div class="forgot-password">
                <a href="/recuperar-senha" aria-label="Recuperar senha">Esqueci minha senha</a>
            </div>

            {% if erro %}
                <div class="error-message" role="alert">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span aria-live="polite">{{ erro }}</span>
                </div>
            {% endif %}

            <button type="submit" class="auth-btn" id="submitBtn" aria-label="Entrar no sistema">Entrar</button>
        </form>

        <div class="auth-footer">
            <p>© 2025 Prado Tech Technology</p>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordField = document.getElementById('senha');
            const icon = this;
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
                icon.setAttribute('aria-label', 'Ocultar senha');
            } else {
                passwordField.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
                icon.setAttribute('aria-label', 'Mostrar senha');
            }
        });

        // Validação em tempo real
        document.getElementById('usuario').addEventListener('input', function() {
            const userError = document.getElementById('userError');
            const userErrorSpan = userError.querySelector('span');
            if (this.value.length < 3) {
                userError.style.display = 'flex';
                userErrorSpan.textContent = 'Usuário deve ter pelo menos 3 caracteres';
            } else {
                userError.style.display = 'none';
                userErrorSpan.textContent = '';
            }
        });

        document.getElementById('senha').addEventListener('input', function() {
            const passError = document.getElementById('passError');
            const passErrorSpan = passError.querySelector('span');
            if (this.value.length < 6) {
                passError.style.display = 'flex';
                passErrorSpan.textContent = 'Senha deve ter pelo menos 6 caracteres';
            } else {
                passError.style.display = 'none';
                passErrorSpan.textContent = '';
            }
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const usuario = document.getElementById('usuario');
            const senha = document.getElementById('senha');
            const userError = document.getElementById('userError');
            const passError = document.getElementById('passError');
            const userErrorSpan = userError.querySelector('span');
            const passErrorSpan = passError.querySelector('span');
            let isValid = true;

            if (usuario.value.length < 3) {
                userError.style.display = 'flex';
                userErrorSpan.textContent = 'Usuário deve ter pelo menos 3 caracteres';
                usuario.focus();
                isValid = false;
            } else {
                userError.style.display = 'none';
                userErrorSpan.textContent = '';
            }

            if (senha.value.length < 6) {
                passError.style.display = 'flex';
                passErrorSpan.textContent = 'Senha deve ter pelo menos 6 caracteres';
                if (isValid) senha.focus();
                isValid = false;
            } else {
                passError.style.display = 'none';
                passErrorSpan.textContent = '';
            }

            if (!isValid) {
                e.preventDefault();
            }
        });

        // Foco automático no campo de usuário
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('usuario').focus();
        });
    </script>
</body>
</html>
