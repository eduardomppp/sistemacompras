<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Fornecedores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .search-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .search-input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 0 10px;
            font-size: 14px;
        }
        .search-button {
            padding: 10px 20px;
            background-color: #022855;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .search-button:hover {
            background-color: #011c3f;
        }
        .table-container {
            max-width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            min-height: 400px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }
        th {
            background-color: #022855;
            color: white;
            text-transform: uppercase;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #cce7ff;
        }
        .export-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #022855;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .export-button:hover {
            background-color: #011c3f;
        }
        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .delete-btn:hover {
            background-color: #cc0000;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        /* Estilos da Paginação */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        .pagination button {
            padding: 8px 16px;
            border: 1px solid #022855;
            background-color: white;
            color: #022855;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .pagination button:hover:not(:disabled) {
            background-color: #022855;
            color: white;
        }
        .pagination button:disabled {
            background-color: #cccccc;
            color: #666666;
            cursor: not-allowed;
            border-color: #cccccc;
        }
        .pagination-info {
            margin: 0 15px;
            font-size: 14px;
        }
        .page-size-selector {
            margin-left: 15px;
        }
        .page-size-selector select {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="searchNameCNPJ" class="search-input" placeholder="Pesquisar por Nome ou CNPJ">
        <input type="text" id="searchMaterial" class="search-input" placeholder="Pesquisar por Materiais">
        <button class="search-button" onclick="loadFornecedores(1)">Pesquisar</button>
        <button class="search-button" onclick="clearSearch()">Limpar</button>
    </div>
    
    <button class="export-button" onclick="exportCSV()">Exportar para CSV</button>
    
    <div class="table-container">
        <table id="fornecedores-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome Fantasia</th>
                    <th>CNPJ</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>Endereço</th>
                    <th>Bairro</th>
                    <th>Cidade</th>
                    <th>Estado</th>
                    <th>Contato</th>
                    <th>Materiais</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="12" class="loading">Carregando fornecedores...</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Controles de Paginação -->
    <div class="pagination">
        <button onclick="changePage(currentPage - 1)" id="prev-btn" disabled>Anterior</button>
        <span class="pagination-info" id="page-info">Página 1 de 1</span>
        <button onclick="changePage(currentPage + 1)" id="next-btn" disabled>Próxima</button>
        
        <div class="page-size-selector">
            <label for="page-size">Itens por página:</label>
            <select id="page-size" onchange="changePageSize()">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
    </div>

    <script>
        // Variáveis de paginação
        let currentPage = 1;
        let pageSize = 25;
        let totalPages = 1;
        let totalCount = 0;
        let currentSearchName = '';
        let currentSearchMaterial = '';

        // Carregar fornecedores quando a página é carregada
        document.addEventListener('DOMContentLoaded', function() {
            loadFornecedores(1);
            
            // Permitir busca com Enter
            document.getElementById('searchNameCNPJ').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loadFornecedores(1);
            });
            
            document.getElementById('searchMaterial').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loadFornecedores(1);
            });
        });

        // Função para carregar fornecedores da API
        function loadFornecedores(page) {
            const searchName = document.getElementById('searchNameCNPJ').value;
            const searchMaterial = document.getElementById('searchMaterial').value;
            
            currentSearchName = searchName;
            currentSearchMaterial = searchMaterial;
            
            showLoading();
            
            const params = new URLSearchParams({
                page: page,
                per_page: pageSize,
                search_name: searchName,
                search_material: searchMaterial
            });
            
            fetch(`/api/fornecedores?${params}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderFornecedores(data.fornecedores);
                        updatePagination(data.pagination);
                    } else {
                        showError('Erro ao carregar fornecedores: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    showError('Erro ao carregar fornecedores');
                });
        }

        // Função para renderizar fornecedores na tabela
        function renderFornecedores(fornecedores) {
            const tableBody = document.getElementById('table-body');
            
            if (fornecedores.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="12" class="loading">Nenhum fornecedor encontrado</td></tr>';
                return;
            }
            
            let html = '';
            fornecedores.forEach(fornecedor => {
                html += `
                <tr data-id="${fornecedor.id}">
                    <td>${fornecedor.id}</td>
                    <td class="nome-fantasia">${fornecedor.nome_fantasia || 'N/A'}</td>
                    <td class="cnpj">${fornecedor.cnpj_formatado || 'N/A'}</td>
                    <td>${fornecedor.telefone || 'N/A'}</td>
                    <td>${fornecedor.email || 'N/A'}</td>
                    <td>${fornecedor.endereco || 'N/A'}</td>
                    <td>${fornecedor.bairro || 'N/A'}</td>
                    <td>${fornecedor.cidade || 'N/A'}</td>
                    <td>${fornecedor.estado || 'N/A'}</td>
                    <td>${fornecedor.contato || 'N/A'}</td>
                    <td class="materiais">${fornecedor.materiais || 'N/A'}</td>
                    <td><button class="delete-btn" onclick="deleteRow(this)">Excluir</button></td>
                </tr>
                `;
            });
            
            tableBody.innerHTML = html;
        }

        // Função para mostrar loading
        function showLoading() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '<tr><td colspan="12" class="loading">Carregando fornecedores...</td></tr>';
        }

        // Função para mostrar erro
        function showError(message) {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = `<tr><td colspan="12" class="loading" style="color: red;">${message}</td></tr>`;
        }

        // Função para mudar de página
        function changePage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadFornecedores(page);
        }

        // Função para mudar o tamanho da página
        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            loadFornecedores(1);
        }

        // Função para atualizar a paginação
        function updatePagination(pagination) {
            currentPage = pagination.page;
            totalPages = pagination.total_pages;
            totalCount = pagination.total_count;
            
            document.getElementById('page-info').textContent = 
                `Página ${currentPage} de ${totalPages} (${totalCount} registros)`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages || totalPages === 0;
        }

        // Função para limpar busca
        function clearSearch() {
            document.getElementById('searchNameCNPJ').value = '';
            document.getElementById('searchMaterial').value = '';
            loadFornecedores(1);
        }

        // Função para exportar CSV (agora busca todos os dados)
        function exportCSV() {
            // Para exportar, buscamos todos os dados sem paginação
            const params = new URLSearchParams({
                page: 1,
                per_page: 1000000, // Número grande para pegar tudo
                search_name: currentSearchName,
                search_material: currentSearchMaterial
            });
            
            fetch(`/api/fornecedores?${params}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        exportToCSV(data.fornecedores);
                    } else {
                        alert('Erro ao exportar dados: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    alert('Erro ao exportar dados');
                });
        }

        // Função auxiliar para exportar para CSV
        function exportToCSV(fornecedores) {
            if (fornecedores.length === 0) {
                alert('Nenhum dado para exportar');
                return;
            }
            
            const headers = ['ID', 'Nome Fantasia', 'CNPJ', 'Telefone', 'Email', 'Endereço', 
                           'Bairro', 'Cidade', 'Estado', 'Contato', 'Materiais'];
            
            let csv = [headers.join(',')];
            
            fornecedores.forEach(fornecedor => {
                const row = [
                    fornecedor.id,
                    `"${fornecedor.nome_fantasia || ''}"`,
                    `"${fornecedor.cnpj_formatado || ''}"`,
                    `"${fornecedor.telefone || ''}"`,
                    `"${fornecedor.email || ''}"`,
                    `"${fornecedor.endereco || ''}"`,
                    `"${fornecedor.bairro || ''}"`,
                    `"${fornecedor.cidade || ''}"`,
                    `"${fornecedor.estado || ''}"`,
                    `"${fornecedor.contato || ''}"`,
                    `"${fornecedor.materiais || ''}"`
                ];
                csv.push(row.join(','));
            });
            
            const csvContent = "data:text/csv;charset=utf-8," + csv.join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', 'fornecedores.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Função para excluir fornecedor
        function deleteRow(button) {
            if (!confirm('Tem certeza que deseja excluir este fornecedor?')) {
                return;
            }
            
            const row = button.parentNode.parentNode;
            const supplierId = row.getAttribute('data-id');
            
            fetch('/delete_supplier', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: supplierId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Recarregar a página atual após exclusão
                    loadFornecedores(currentPage);
                    alert('Fornecedor excluído com sucesso!');
                } else {
                    alert('Erro ao excluir o fornecedor: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                alert('Erro ao excluir o fornecedor.');
            });
        }
    </script>
</body>
</html>
